<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Electric Duo Control Center</title>
  <style>
    :root {
      --bg: #060F16;
      --panel: #0B1A23;
      --panel-2: #0E212C;
      --line: #17323F;
      --cyan: #00B1E2;
      --text: #D6E7EF;
      --muted: #7C9BAA;
      --warn: #F2A33C;
      --font-display: "Helvetica Neue", "Arial Narrow", Inter, system-ui, sans-serif;
      --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 28px 26px; }
    .login-card h1 { font-family: var(--font-display); text-transform: uppercase; font-size: 20px; margin: 6px 0 20px; letter-spacing: -0.01em; }
    .login-card label { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
    .login-card input {
      width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
      font-size: 14px; padding: 9px 10px; border-radius: 5px;
    }
    .login-card input:focus { outline: 1px solid var(--cyan); border-color: var(--cyan); }
    .login-card button {
      width: 100%; margin-top: 20px; background: var(--cyan); border: 0; color: var(--bg); font-weight: 700;
      font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; padding: 11px 0; border-radius: 5px; cursor: pointer;
    }
    .login-card button:hover { background: #17c6f5; }
    .login-card button:disabled { opacity: 0.5; cursor: default; }
    .login-error { color: var(--warn); font-size: 12.5px; margin-top: 12px; min-height: 1em; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="eyebrow">The Electric Duo</div>
      <h1>Control center</h1>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" id="loginBtn">Sign in</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
  </div>
  <script src="/assets/login.js"></script>
</body>
</html>
